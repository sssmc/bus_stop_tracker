<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Bus Stop Tracker — Stop List</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="list-page">
  <div id="list-controls">
    <a href="index.html">Map view</a>
    <input type="text" id="search" placeholder="Search stops..." />
    <label><input type="checkbox" id="toggle-group" checked /> Group by route</label>
    <span id="stats"></span>
  </div>
  <details id="activity-panel">
    <summary>
      <span>Recent activity</span>
      <button type="button" id="undo-last">Undo last</button>
    </summary>
    <ul id="activity-list"></ul>
  </details>
  <div id="badges" class="badges-strip"></div>
  <details id="muni-panel">
    <summary>By municipality</summary>
    <div id="muni-board"></div>
  </details>
  <div id="stop-list"></div>
  <script src="score.js"></script>
  <script src="activity.js"></script>
  <script src="achievements.js"></script>
  <script src="stops.js"></script>
</body>
</html>
